name: Deploy GitHub Pages redirect

# The web app itself is deployed to app.getrescript.com by Vercel (see
# vercel.json), which can serve the cross-origin isolation headers GitHub Pages
# cannot. This workflow keeps the old wassgha.github.io/rescript URL alive as a
# redirect so existing links, README badges, and shared URLs still land in the
# editor.

on:
  push:
    branches: [main]
    paths:
      - "redirect/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble redirect site
        run: |
          mkdir -p site
          cp redirect/index.html site/index.html
          # Deep links (/rescript/editor) have no file on Pages, so 404.html is
          # served for those — it runs the same path-preserving redirect.
          cp redirect/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
